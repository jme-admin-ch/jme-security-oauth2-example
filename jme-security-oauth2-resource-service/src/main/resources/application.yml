spring:
  application:
    name: jme-security-oauth2-resource-service
server:
  servlet:
    context-path: /${spring.application.name}
springdoc:
  api-docs:
    path: "/api-docs"
    pathsToMatch: "/api/**"
jeap:
  monitor:
    prometheus:
      user: "prometheus"
      password: "{noop}secret"
  security:
    oauth2:
      resourceserver:
        resource-id: "https://resources.jme.admin.ch/jme/jme-security-oauth2-resource-service"
        strict-audience-validation: "on"
      current-user-endpoint:
        enabled: true
