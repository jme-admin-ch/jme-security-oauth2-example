description:
  en:
    localisedName: jme-security-oauth2-example
    shortDescription: Example services demonstrating OAuth2 clients, resources, roles and custom authorities with JME.
    longDescription: >
      This project demonstrates OAuth2 client-credentials service chains using the jEAP security starter. It includes a
      local authorization server, resource and client services for simple roles, and resource and client services for
      custom authorities. Portable integration tests start and exercise all five services.
    features:
      - Demonstrates OAuth2-protected Spring Boot resources and clients
      - Shows simple-role and custom-authorities authorization models
      - Includes a local OAuth2 server and full service-chain integration tests
