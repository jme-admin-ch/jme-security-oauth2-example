management:
  server:
    port: 8082
    base-path: /${spring.application.name}
target:
  resource: "https://bit-jme-d.apps.p-szb-ros-shrd-npr-01.cloud.admin.ch/jme-security-oauth2-resource-service"

spring:
  security:
    oauth2:
      client:
        registration:
          jme-security-oauth2-client-service:
            client-id: "jme-security-oauth2-client-service"
            client-secret: "secret"
            authorization-grant-type: "client_credentials"
            provider: "default-provider"
        provider:
          default-provider:
            issuer-uri: "https://bit-jme-d.apps.p-szb-ros-shrd-npr-01.cloud.admin.ch/jme-security-oauth2-auth-scs"

